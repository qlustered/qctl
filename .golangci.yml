version: "2"
run:
  tests: true
linters:
  enable:
    - goconst
    - gocritic
    - gocyclo
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: false  # Type is verified before assertion in our code patterns
      check-blank: false  # We use _ intentionally for delete operations that may fail
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    govet:
      enable-all: true
      disable:
        - shadow  # Variable shadowing with err is common Go pattern, not a bug
        # Field order in manifest/output structs is user-visible (YAML/JSON output
        # follows declaration order), so alignment reordering breaks output stability.
        - fieldalignment
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - goconst
          - gocyclo
        path: _test\.go
      # Ignore stuttering warnings for type aliases from generated API client
      - linters:
          - revive
        text: "stutters"
        path: internal/(alerts|datasets|ingestion|warnings|rules|datasources|orgs|users)/client\.go
      # Ignore errcheck for cobra flag getters - these only fail if flag name doesn't exist
      # which is a programming error caught at startup, not a runtime error
      - linters:
          - errcheck
        text: "GetString|GetBool|GetInt|GetFloat|Set"
        path: internal/(commands|output)/
      # Ignore errcheck in test utilities - test failures surface issues
      - linters:
          - errcheck
        path: internal/testutil/
      # Ignore unused parameters in test files - mock handlers legitimately ignore params
      - linters:
          - revive
        text: "unused-parameter"
        path: _test\.go
      # Ignore unused parameters in command files - cobra handlers often don't use cmd/args
      - linters:
          - revive
        text: "unused-parameter"
        path: internal/commands/
      # Ignore package naming with underscores - matches backend entity names
      - linters:
          - revive
        text: "don't use an underscore in package name"
        path: internal/(cloud_sources|stored_items|rule_versions|review_policies|rule_suggestions|composite_run_jobs|rule_run_replays|table_series)/
      # Ignore errors package name warning - internal packages can use common names
      - linters:
          - revive
        text: "avoid package names that conflict with Go standard library"
        path: internal/errors/
      # Ignore meaningless-package-name warning for "api" - it predates this
      # rule surfacing (client.gen.go was the package's only file and is
      # excluded from lint below); renaming it ripples across every domain
      # package's type aliases (api.AlertSchema and friends).
      - linters:
          - revive
        text: "avoid meaningless package names"
        path: internal/api/
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/api/client\.gen\.go$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
